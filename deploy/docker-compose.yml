# TutorHub on one VPS.
#
#   always on     caddy (HTTPS), app (Next.js), cron (reminder job)
#   profile "supabase"  your own Supabase: db, kong (API gateway), auth, rest, realtime, storage
#   profile "jitsi"     your own Jitsi Meet: web, prosody, jicofo, jvb
#
# You normally do not call this file directly: ./scripts/deploy.sh reads deploy/.env, picks the profiles
# (DATABASE_MODE / VIDEO_PROVIDER) and runs `docker compose up -d --build` for you.

name: tutorhub

x-jitsi-env: &jitsi-env
  TZ: ${TZ:-UTC}
  PUBLIC_URL: https://${VIDEO_DOMAIN:-video.invalid}
  XMPP_DOMAIN: meet.jitsi
  XMPP_SERVER: xmpp.meet.jitsi
  XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
  XMPP_AUTH_DOMAIN: auth.meet.jitsi
  XMPP_MUC_DOMAIN: muc.meet.jitsi
  XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
  XMPP_GUEST_DOMAIN: guest.meet.jitsi
  JICOFO_AUTH_USER: focus
  JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:-}
  JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET:-}
  JVB_AUTH_USER: jvb
  JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:-}
  JVB_BREWERY_MUC: jvbbrewery
  # Optional: only people holding a token signed by the app can open rooms (see JITSI_REQUIRE_TOKEN in .env)
  ENABLE_AUTH: ${JITSI_ENABLE_AUTH:-0}
  ENABLE_GUESTS: ${JITSI_ENABLE_GUESTS:-1}
  AUTH_TYPE: jwt
  JWT_APP_ID: ${JITSI_JWT_APP_ID:-tutorhub}
  JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET:-}
  JWT_ACCEPTED_ISSUERS: ${JITSI_JWT_APP_ID:-tutorhub}
  JWT_ACCEPTED_AUDIENCES: ${JITSI_JWT_APP_ID:-tutorhub}

x-restart: &restart
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ edge
  caddy:
    <<: *restart
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:-}
      VIDEO_DOMAIN: ${VIDEO_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro # generated by scripts/deploy.sh from deploy/caddy/*.caddy
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # ------------------------------------------------------------------ the app
  app:
    <<: *restart
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CRON_SECRET: ${CRON_SECRET}
      # Video: VIDEO_PROVIDER = self-hosted | jaas | public (see src/lib/video-provider.ts)
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-public}
      JITSI_DOMAIN: ${VIDEO_DOMAIN:-}
      JITSI_JWT_APP_ID: ${JITSI_JWT_APP_ID:-}
      JITSI_JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET:-}
      JAAS_APP_ID: ${JAAS_APP_ID:-}
      JAAS_KEY_ID: ${JAAS_KEY_ID:-}
      JAAS_PRIVATE_KEY: ${JAAS_PRIVATE_KEY:-}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-}
      DEMO_LOGIN_ALLOW_PRODUCTION: ${DEMO_LOGIN_ALLOW_PRODUCTION:-}
      DEMO_TUTOR_EMAIL: ${DEMO_TUTOR_EMAIL:-}
      DEMO_TUTOR_PASSWORD: ${DEMO_TUTOR_PASSWORD:-}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}

  # Vercel Cron does not exist on a VPS: call the reminder job every 15 minutes instead
  cron:
    <<: *restart
    image: curlimages/curl:8.11.1
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do sleep 900; curl -fsS -m 120 -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders > /dev/null || echo "reminder job failed"; done'

  # ------------------------------------------------------------------ profile: supabase
  db:
    <<: *restart
    profiles: [supabase]
    image: supabase/postgres:15.8.1.085
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./supabase/init/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./supabase/init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro

  kong:
    <<: *restart
    profiles: [supabase]
    image: kong:2.8.1
    depends_on:
      - auth
      - rest
      - realtime
      - storage
    # The gateway: https://API_DOMAIN/{auth,rest,realtime,storage}/v1/... with the apikey header checked
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./supabase/kong.yml:/home/kong/temp.yml:ro

  auth:
    <<: *restart
    profiles: [supabase]
    image: supabase/gotrue:v2.174.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://${APP_DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://${APP_DOMAIN}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: ${EMAIL_FROM_ADDRESS:-no-reply@localhost}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${SMTP_USER:-resend}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-${RESEND_API_KEY:-}}
      GOTRUE_SMTP_SENDER_NAME: TutorHub
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # Optional "Continue with Google": fill GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in .env
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_URL}/auth/v1/callback

  rest:
    <<: *restart
    profiles: [supabase]
    image: postgrest/postgrest:v12.2.12
    depends_on:
      db:
        condition: service_healthy
    command: ["postgrest"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  # The lesson whiteboard uses Realtime broadcast (src/lib/realtime/channel.ts)
  realtime:
    <<: *restart
    profiles: [supabase]
    image: supabase/realtime:v2.34.47
    # The tenant name ("realtime-dev") is taken from the first part of this host name
    container_name: realtime-dev.supabase-realtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      LOG_LEVEL: error
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${SUPABASE_ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  storage:
    <<: *restart
    profiles: [supabase]
    image: supabase/storage-api:v1.24.7
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  # ------------------------------------------------------------------ profile: jitsi (open-source video)
  # UDP 10000 must be reachable from the internet and JVB_PUBLIC_IP must be this server's public IP.
  prosody:
    <<: *restart
    profiles: [jitsi]
    image: jitsi/prosody:stable
    environment:
      <<: *jitsi-env
    volumes:
      - jitsi-prosody-config:/config
      - jitsi-prosody-plugins:/prosody-plugins-custom
    networks:
      default:
        aliases:
          - xmpp.meet.jitsi

  jicofo:
    <<: *restart
    profiles: [jitsi]
    image: jitsi/jicofo:stable
    depends_on:
      - prosody
    environment:
      <<: *jitsi-env
    volumes:
      - jitsi-jicofo-config:/config

  jvb:
    <<: *restart
    profiles: [jitsi]
    image: jitsi/jvb:stable
    depends_on:
      - prosody
    ports:
      - "10000:10000/udp"
    environment:
      <<: *jitsi-env
      JVB_PORT: 10000
      JVB_ADVERTISE_IPS: ${JVB_PUBLIC_IP:-}
    volumes:
      - jitsi-jvb-config:/config

  # The Jitsi web UI and external_api.js, behind Caddy (Caddy does the HTTPS)
  jitsi-web:
    <<: *restart
    profiles: [jitsi]
    image: jitsi/web:stable
    depends_on:
      - prosody
      - jicofo
      - jvb
    environment:
      <<: *jitsi-env
      DISABLE_HTTPS: 1
      ENABLE_HTTP_REDIRECT: 0
      ENABLE_LETSENCRYPT: 0
      HTTP_PORT: 80
    volumes:
      - jitsi-web-config:/config
    networks:
      default:
        aliases:
          - meet.jitsi

volumes:
  caddy-data:
  caddy-config:
  db-data:
  db-config:
  storage-data:
  jitsi-prosody-config:
  jitsi-prosody-plugins:
  jitsi-jicofo-config:
  jitsi-jvb-config:
  jitsi-web-config:
